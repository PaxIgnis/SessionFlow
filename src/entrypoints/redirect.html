<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="redirect">Redirect</title>
    <style>
      .copied-message {
        display: none;
        color: green;
        margin-left: 10px;
      }
      .copied-message.visible {
        display: inline;
      }
    </style>
  </head>
  <body>
    <p
      id="message"
      data-i18n="redirecting"
    >
      Redirecting
    </p>
    <a
      id="target-url"
      href="#"
      target="_self"
    ></a>
    <span
      id="copied-message"
      class="copied-message"
      role="status"
      aria-live="polite"
      ><span data-i18n="copied">Copied!</span></span
    >
    <script
      type="module"
      src="./redirect/main.ts"
    ></script>
  </body>
</html>
